[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "superflore"
description = "Super Bloom"
readme = "README.md"
license = "Apache-2.0 AND MIT"
authors = [
    { name = "Hunter L. Allen", email = "hunterlallen@protonmail.com" },
]
maintainers = [
    { name = "Rob Woolley", email = "rob.woolley@windriver.com" },
]
keywords = ["ROS"]
classifiers = [
    "Programming Language :: Python",
]
requires-python = ">=3"
dynamic = ["version"]
dependencies = [
    "xmltodict",
    "termcolor",
    "setuptools",
    "rosinstall_generator",
    "rosdistro >= 0.7.4",
    "rosdep >= 0.15.2",
    "gitpython",
    "requests",
    "docker",
    "pyyaml",
    "pygithub",
    "catkin_pkg >= 0.4.10",
    "rospkg >= 1.1.8",
]

[project.urls]
Homepage = "https://github.com/ros-infrastructure/superflore"

[project.scripts]
superflore-gen-ebuilds = "superflore.generators.ebuild:main"
superflore-gen-oe-recipes = "superflore.generators.bitbake:main"
superflore-gen-nix = "superflore.generators.nix:main"
superflore-check-ebuilds = "superflore.test_integration.gentoo:main"

[project.optional-dependencies]
test = [
    "pytest",
]
dev = [
    "ruff",
    "pre-commit",
    "mypy",
    "superflore[test]",
]

[tool.setuptools]
packages = { find = { exclude = ["tests", "tests.*"] } }

[tool.setuptools_scm]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
# Type checking is opt-in per module: only files that already carry some
# type annotations are checked, and errors from unlisted modules pulled in
# via imports are silenced so the checked boundary stays explicit. This
# runs report-only in CI (see ci.yaml); expand `files` opportunistically as
# modules gain annotations, rather than as a dedicated typing sweep.
files = [
    "superflore/generators/nix/nix_expression.py",
    "superflore/generators/nix/gen_packages.py",
    "superflore/generators/nix/nix_package.py",
    "superflore/generators/nix/nix_package_set.py",
    "superflore/utils.py",
]
ignore_missing_imports = true
follow_imports = "silent"
